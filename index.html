<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="logo-container">
        <div class="logo-text">
            <img src="odin-lined.png" alt="odin-logo">
            Odin
        </div>
        <div class="logo-credit"> Photo by <a href="">Halie West</a> on <a href="unsplash.com">Unplash  </a></div>
    </div>  
    <div class="form-container">
        <div class="hook">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>

            <p>Sign up <span>now</span> to get started. </p>
            
            <p class="call-to-action">You <span>know</span> you want to.</p>

        </div>
        <form action="" method="">
            <legend>Let's do this!</legend>
            <div class="form-row">
                <label for="first-name"> FIRST NAME
                    <input type="text" id="first-name" name="first-name" placeholder="Thor">
                </label>
                <label for="last-name"> LAST NAME
                    <input type="text" name="last-name" id="last-name" placeholder="Odinson">
                </label>
            </div>
            <div class="form-row">
                <label for="email"> EMAIL
                    <input type="email" name="email" id="email">
                </label>
                <label for="phone-number"> PHONE NUMBER
                    <input type="number" name="phone-number" id="phone-number">
                </label>
            </div>
            <div class="form-row">
                <label for="password"> PASSWORD
                    <input type="text" name="password" id="password">
                </label>
                <label for="confirm-password"> CONFIRM PASSWORD
                    <input type="text" name="confirm-password" id="confirm-password">
                </label>
            </div>
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
    </div>
    </form>

</body>
</html>
