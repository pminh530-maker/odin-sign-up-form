<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="logo-container">
        <div class="logo-text">
            <img src="odin-lined.png" alt="odin-logo">
            Odin
        </div>
        <div class="logo-credit"> Photo by <a href="">Halie West</a> on <a href="">Unplash</a></div>
    </div>  
    <div class="form-container">
        <div class="hook">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>

            <p>Sign up <span>now</span> to get started. </p>
            
            <p class="call-to-action">You <span>know</span> you want to.</p>

        </div>
        <form action="" method="" id="sign-up-form">
            <legend>Let's do this!</legend>
            <div class="column-container">
                <div class="column-1">
                    <label for="first-name">FIRST NAME</label><input type="text" name="first-name" id="first-name" placeholder="Thor">
                    <label for="email">EMAIL</label><input type="email" name="email" id="email">
                    <label for="password">PASSWORD</label><input type="text" name="password" id="password" required></input>
                </div>
                <div class="column-2">
                    <label for="last-name">FIRST NAME</label><input type="text" name="last-name" id="last-name" placeholder="Odinson">
                    <label for="phone-number">PHONE NUMBER</label><input type="text" name="phone-number" id="phone-number">
                    <label for="confirm-password">PASSWORD</label><input type="text" name="confirm-password" id="confirm-password" required></input>
                </div>
            </div>
        </form>
    <div class="submit-button" form="sign-up-form">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
    </div>

</body>
</html>
